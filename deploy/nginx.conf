# Replace example.com with your domain.
limit_req_zone $binary_remote_addr zone=print_login:1m rate=10r/m;

server {
    listen 80;
    server_name example.com;

    # Keep this just above MAX_TOTAL_MB in src/lib/types.ts
    client_max_body_size 201m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/login {
        limit_req zone=print_login burst=5 nodelay;
        include /etc/nginx/snippets/print-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/print-proxy.conf;
    }
}
